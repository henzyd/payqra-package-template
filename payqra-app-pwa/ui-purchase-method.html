<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">

    <!-- font -->
    <link rel="stylesheet" href="fonts/fonts.css">
    <!-- Icons -->
    <link rel="stylesheet" href="icons/icomoon/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/jquery-ui.min.css">
    <link rel="stylesheet" href="css/bootstrap-select.min.css">
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <link rel="stylesheet" type="text/css" href="css/styles.css" />


    <!-- Favicon and Touch Icons  -->
    <link rel="shortcut icon" href="images/logo/40.png" />
    <link rel="apple-touch-icon-precomposed" href="images/logo/40.png" />

    <title>PayQra</title>
</head>

<body>
    <!-- preloade -->
    <div class="preload preload-container">
        <div class="logo-img">
            <img src="images/logo/logo.svg" alt="">
        </div>
        <div class="spinner-circle lg success">
            <span class="spinner-circle1 spinner-child"></span>
            <span class="spinner-circle2 spinner-child"></span>
            <span class="spinner-circle3 spinner-child"></span>
            <span class="spinner-circle4 spinner-child"></span>
            <span class="spinner-circle5 spinner-child"></span>
            <span class="spinner-circle6 spinner-child"></span>
            <span class="spinner-circle7 spinner-child"></span>
            <span class="spinner-circle8 spinner-child"></span>
            <span class="spinner-circle9 spinner-child"></span>
        </div>
    </div>
    <!-- /preload -->
    <div class="wrap">
        <div class="header-2">
            <div class="tf-container">
                <div class="header-content">

                    <a href="#" class="tf-btn-arrow back-btn">
                        <i class="icon-arrow-narrow-left"></i>
                    </a>
                    <h4 class="title fw-5">
                        Purchase method
                    </h4>
                </div>
            </div>
        </div>

        <div class="tf-container">

            <div class="purchase-item mb-16">
                <input type="radio" id="purchase-1" class="tf-check-rounded style-checked-white" name="purchase-item">
                <label for="purchase-1">
                    <i class="icon-card-stroke"></i>
                    <span class="content">
                        <span class="title fw-7 text-medium">Financing</span>
                        <span class="sub-title">Everything simply online, <br>approval within 30 minutes</span>
                    </span>
                </label>
            </div>

            <div class="purchase-item mb-16">
                <input type="radio" id="purchase-2" class="tf-check-rounded style-checked-white" name="purchase-item"
                    checked>
                <label for="purchase-2">
                    <i class="icon-dollar-circle"></i>
                    <span class="content">
                        <span class="title fw-7 text-medium">Payment full</span>
                        <span class="sub-title">Everything simply online, <br>approval within 30 minutes</span>
                    </span>
                </label>
            </div>

            <div class="purchase-item style-dark mb-16">
                <input type="radio" id="purchase-3" class="tf-check-rounded style-checked-white" name="purchase-item2"
                    checked>
                <label for="purchase-3">
                    <i class="icon-card-stroke"></i>
                    <span class="content">
                        <span class="title fw-7 text-medium">Financing</span>
                        <span class="sub-title">Everything simply online, <br>approval within 30 minutes</span>
                    </span>
                </label>
            </div>

            <div class="purchase-item style-dark mb-16">
                <input type="radio" id="purchase-4" class="tf-check-rounded style-checked-white" name="purchase-item2">
                <label for="purchase-4">
                    <i class="icon-dollar-circle"></i>
                    <span class="content">
                        <span class="title fw-7 text-medium">Payment full</span>
                        <span class="sub-title">Everything simply online, <br>approval within 30 minutes</span>
                    </span>
                </label>
            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/count-down.js"></script>
    <script src="js/bootstrap-select.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/carousel.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
